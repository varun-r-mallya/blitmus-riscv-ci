name: blitmus on riscv64

on:
  push:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterations per test on the runner's own kernel (x10000 executions)"
        default: "4100"
      kernel_iterations:
        description: "Iterations per test under the custom kernel in QEMU (x10000 executions)"
        default: "400"
      runner_kernel_label:
        description: "Also probe + run the suite on this label's own kernel (e.g. ubuntu-26.04-riscv, early access; not served to us so far)"
        default: ""

jobs:
  probe:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe runner (CPU, kernel, privileges, BPF, KVM)
        run: bash ci/probe.sh 2>&1 | tee probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-ubuntu-24.04-riscv
          path: probe.txt

  # The 24.04 pool runs Scaleway's 5.10 vendor kernel, which rejects these
  # programs (no BPF atomics), so running on a runner's own kernel is opt-in
  # for other labels only.  Jobs for a label RISE doesn't serve us stay queued
  # until GitHub drops them (24h), which is why this is not on by default.
  probe-other:
    if: ${{ inputs.runner_kernel_label != '' }}
    runs-on: ${{ inputs.runner_kernel_label }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe runner (CPU, kernel, privileges, BPF, KVM)
        run: bash ci/probe.sh 2>&1 | tee probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ inputs.runner_kernel_label }}
          path: probe.txt

  litmus:
    if: ${{ inputs.runner_kernel_label != '' }}
    runs-on: ${{ inputs.runner_kernel_label }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run blitmus suite on the runner kernel
        shell: bash
        env:
          ITER: ${{ inputs.iterations || '4100' }}
        run: bash ci/run-tests.sh 2>&1 | tee summary.txt
      - name: Collect logs
        if: always()
        run: sudo chown -R "$(id -u)" logs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litmus-logs-runner-kernel
          path: |
            summary.txt
            logs/

  custom-kernel:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Run blitmus suite under bpf-next in QEMU
        shell: bash
        env:
          ITER: ${{ inputs.kernel_iterations || '400' }}
        run: bash ci/run-custom-kernel.sh 2>&1 | tee summary.txt
      - name: Collect logs
        if: always()
        run: sudo chown -R "$(id -u)" logs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litmus-logs-custom-kernel
          path: |
            summary.txt
            kvm-probe.txt
            logs/
